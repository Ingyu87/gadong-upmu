.hsw::before{left:0;background:linear-gradient(90deg,#fdebd6,#fdebd600)}.hsw::after{right:0;background:linear-gradient(270deg,#fdebd6,#fdebd600)}
.hsw.hs-l::before,.hsw.hs-r::after{opacity:1}
.hsa{position:absolute;top:50%;transform:translateY(-55%);z-index:3;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--acc);font-size:30px;font-weight:800;line-height:1;box-shadow:0 4px 14px -4px rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:0 0 4px}
.hsa.hl{left:-4px}.hsa.hr{right:-4px}
